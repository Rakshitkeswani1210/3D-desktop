<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rakshit&rsquo;s Desktop</title>
    <!-- The Windows flag, the same 32px bitmap the Start button wears.
         Inlined rather than shipped as a file, like every other icon here. -->
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAA00lEQVR42u2W0Q6AIAhF+XT//PYgOC0kNGmtSbsPrhZH8DKJdnwk8AcAOLUcBJO6BYADFA9V/oLOrqyEzTqxwCrv5EmsAQANRgWAogtA/fTaAL3sVlviAGAflOUVOC+gwZwSxAJoMJEAXevdtKUAiAu6lhMXDAC8NwfyJp7NAaLEki5wdZCVUtYIgHsO6MegBahltABTcyAIAMYZwPIK4JpAg2kSRANoMHEAhvXMtlQA4gLdcuICfHQOdG85A3NgPcDAHPDd9ya+986B6Xvkjh076ADz/2PDRlVjyQAAAABJRU5ErkJggg==">
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8ecf5;
        --dim: rgba(232, 236, 245, 0.55);
        --edge: rgba(232, 236, 245, 0.16);
        --panel: rgba(12, 15, 26, 0.5);
        --accent: #7fd6ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #04050b;
        font: 13px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
      }
      #scene { display: block; width: 100%; height: 100%; touch-action: none; }

      .hud {
        position: fixed;
        user-select: none;
        -webkit-user-select: none;
      }

      /* A stage's HUD is a wrapper with no box of its own, so the panels inside
         it stay position:fixed against the viewport rather than against it. */
      .stage-hud { display: contents; }
      .stage-hud[hidden] { display: none !important; }

      .pill {
        font: inherit; font-size: 12px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: background .15s, opacity .15s, color .15s, border-color .15s;
      }
      .pill:hover { background: rgba(255,255,255,.12); }
      .pill.off { opacity: .45; }

      /* ── the nudge toward the power button ──────────────────────────── */

      /* Anchored to the button in 3D and positioned from the frame loop, so it
         follows the tower through camera moves rather than sitting in a corner
         hoping you look at it. Pointer-events off: it must never eat the click
         it is asking for. */
      #power-hint {
        position: fixed;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.96);
        transition: opacity .45s ease, transform .45s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        font-size: 12px;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 7px 14px;
        backdrop-filter: blur(10px);
        box-shadow: 0 6px 24px rgba(0,0,0,.35);
      }
      #power-hint.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

      /* A slow pulse on the dot only. The whole pill throbbing would be a
         nag; one blinking LED reads as the machine waiting for you. */
      #power-hint i {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: hint-pulse 1.8s ease-in-out infinite;
      }
      @keyframes hint-pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

      @media (prefers-reduced-motion: reduce) {
        #power-hint { transition: opacity .2s }
        #power-hint i { animation: none }
      }

      /* ── the stage switcher ─────────────────────────────────────────── */

      #switcher {
        top: 22px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px;
        z-index: 3;
      }
      .pill.on {
        color: var(--accent);
        border-color: rgba(127, 214, 255, .45);
        background: rgba(127, 214, 255, .12);
      }
      #switcher button.on {
        color: var(--accent);
        border-color: rgba(127, 214, 255, .45);
        background: rgba(127, 214, 255, .12);
      }
      #switcher kbd {
        font: inherit; font-size: 10px;
        color: var(--dim);
        margin-right: 6px;
      }
      #switcher button.on kbd { color: rgba(127, 214, 255, .7); }

      /* ── titles and hints, shared by both stages ────────────────────── */

      .title {
        top: 22px; left: 24px;
        pointer-events: none;
        letter-spacing: .01em;
      }
      .title b { font-size: 15px; font-weight: 600; display: block; }
      .title span { font-size: 12px; color: var(--dim); }

      .hint {
        bottom: 22px; left: 24px;
        font-size: 12px; color: var(--dim);
        pointer-events: none;
      }
      .hint kbd {
        font: inherit; color: var(--ink);
        background: rgba(255,255,255,.08);
        border: 1px solid var(--edge);
        border-radius: 4px; padding: 1px 5px;
      }

      .controls {
        top: 22px; right: 24px;
        display: flex; gap: 8px;
      }

      /* Names the button you just pressed — the iPod's screen is intentionally
         blank, so this is the only feedback that the press registered. */
      #readout {
        bottom: 22px; left: 50%; transform: translateX(-50%) translateY(6px);
        font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 7px 18px;
        backdrop-filter: blur(10px);
        opacity: 0;
        transition: opacity .18s ease, transform .18s ease;
        pointer-events: none;
      }
      #readout.on { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* The way back out of the zoom. Only offered once you are in. */
      #desk-back {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity .25s ease, transform .25s ease, background .15s;
      }
      #desk-back.on { opacity: 1; pointer-events: auto; transform: none; }

      /* Narrow viewports: the subject fills most of the frame, so the HUD has
         to shrink onto the edges rather than float over the middle of it. */
      @media (max-width: 700px) {
        .title { top: 44px; left: 12px; }
        .title b { font-size: 12px; }
        .title span { display: none; }
        .controls { top: 44px; right: 12px; gap: 5px; }
        .pill { font-size: 10px; padding: 4px 9px; }
        #switcher { top: 8px; }
        .hint { display: none; }
        #readout { bottom: 12px; font-size: 10px; padding: 5px 13px; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- ── the desktop stage ──────────────────────────────────────────── -->
    <div id="hud-desktop" class="stage-hud" hidden>
      <div class="title hud">
        <b>Rakshit&rsquo;s Desktop</b>
      </div>

      <div class="controls hud">
        <button id="desk-back" class="pill" type="button">&larr; Back</button>
        <button id="desk-camera" class="pill" type="button">Camera</button>
        <!-- Development tools, hidden from the HUD. The tweak panel is still
             on the t key and the part inspector is still at viewer.html; both
             are for building the scene, not for visiting it. -->
        <button id="desk-tweak" class="pill" type="button" hidden>Tweak</button>
        <a href="./viewer.html?part=tower" style="text-decoration:none" hidden>
          <button class="pill" type="button">Parts</button>
        </a>
      </div>

      <div id="desk-hint" class="hint hud"></div>
      <div id="power-hint"><i></i>Press the power button to start</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
